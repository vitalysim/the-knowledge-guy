<body>
{{BODY}}

<div class="kg-toggles" role="group" aria-label="Display options">
  <button type="button" data-toggle="theme" title="Toggle light/dark">◐</button>
  <button type="button" data-toggle="density" title="Toggle density">≡</button>
</div>
<script>
  (() => {
    const root = document.documentElement;
    // Default: follow system; allow saved choice from localStorage if present.
    try {
      const t = localStorage.getItem('kg-theme');
      const d = localStorage.getItem('kg-density');
      if (t) root.dataset.theme = t;
      if (d) root.dataset.density = d;
    } catch (e) {}
    document.querySelectorAll('[data-toggle]').forEach(b => {
      b.addEventListener('click', () => {
        const k = b.dataset.toggle;
        if (k === 'theme') {
          const cur = root.dataset.theme
            || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
          const next = cur === 'dark' ? 'light' : 'dark';
          root.dataset.theme = next;
          try { localStorage.setItem('kg-theme', next); } catch (e) {}
        } else {
          const next = root.dataset.density === 'compact' ? 'comfortable' : 'compact';
          root.dataset.density = next;
          try { localStorage.setItem('kg-density', next); } catch (e) {}
        }
      });
    });
  })();
</script>

<!-- ════════════════════════════════════════════════════════════════════
     LAB ENGINE (added by the-knowledge-guy `course` mode)
     Hydrates a #kg-exercises JSON island into interactive practice.
     No-ops on every page that lacks the island, so it ships harmlessly
     in every artifact. Self-contained; runs from file://. Lab code runs
     in a sandboxed <iframe> (no same-origin), so it can never read the
     progress store. Python lazy-loads Pyodide from CDN and degrades to
     "check with Claude" when offline.
     ════════════════════════════════════════════════════════════════════ -->
<script>
(() => {
  const island = document.getElementById('kg-exercises');
  const mount  = document.getElementById('kg-practice');
  if (!island || !mount) return;

  let data;
  try { data = JSON.parse(island.textContent); } catch (e) {
    mount.innerHTML = '<div class="ex-feedback crit"><span class="fb-lbl">Error</span>Could not parse the exercise data for this chapter.</div>';
    return;
  }
  const exercises = Array.isArray(data) ? data : (data && data.exercises) || [];
  const scope = mount.dataset.scope || (data && data.scope) || 'unknown/unknown';
  const [skillSlug, bookNumber] = scope.split('/');
  const PKEY = 'kg-lab-progress-v1';
  const PYODIDE_CDN = 'https://cdn.jsdelivr.net/pyodide/v0.26.2/full/pyodide.js';

  // — progress store ————————————————————————————————————————
  const load = () => { try { return JSON.parse(localStorage.getItem(PKEY)) || {}; } catch (e) { return {}; } };
  const save = (all) => { try { localStorage.setItem(PKEY, JSON.stringify(all)); } catch (e) {} };
  function setState(id, patch) {
    const all = load();
    const s = (all[scope] = all[scope] || {});
    s[id] = Object.assign({ attempts: 0 }, s[id], patch, { ts: Date.now() });
    save(all);
    paintMastery();
    return s[id];
  }
  const getState = (id) => (load()[scope] || {})[id] || null;

  // — tiny inline markdown (escape first, then code/bold/breaks) ——————
  const esc = (s) => String(s == null ? '' : s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  const md = (s) => esc(s)
    .replace(/`([^`]+)`/g, '<code>$1</code>')
    .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
    .replace(/\n/g, '<br>');
  const cite = (ex) => {
    const bn = (ex.tests && ex.tests.book_number) || bookNumber;
    return `<div class="ex-cite">tests · <span class="ref">${esc(skillSlug)} ${esc(bn)}</span></div>`;
  };
  const head = (ex, badgeOverride) => {
    const st = getState(ex.id);
    let badge = badgeOverride;
    if (!badge) {
      if (st && st.status === 'passed') badge = '<span class="ex-badge pass">cleared</span>';
      else if (st && st.status === 'failed') badge = '<span class="ex-badge fail">retry</span>';
      else if (st && st.status === 'sent') badge = '<span class="ex-badge sent">sent to Claude</span>';
      else badge = `<span class="ex-badge ${esc(ex.difficulty || 'core')}">${esc(ex.difficulty || 'core')}</span>`;
    }
    return `<div class="ex-head"><span class="kicker">${esc(ex.type || ex.family)}</span>${badge}</div>`;
  };

  // — mastery meter ——————————————————————————————————————————
  const meter = document.querySelector('.mastery[data-scope="' + scope + '"]');
  function paintMastery() {
    if (!meter) return;
    const s = load()[scope] || {};
    const total = exercises.length;
    const passed = exercises.filter(e => (s[e.id] || {}).status === 'passed').length;
    const sent = exercises.filter(e => (s[e.id] || {}).status === 'sent').length;
    const pct = total ? Math.round((passed / total) * 100) : 0;
    const fill = meter.querySelector('.mastery-fill');
    if (fill) fill.style.width = pct + '%';
    meter.classList.toggle('complete', total > 0 && passed === total);
    const lbl = meter.querySelector('.mastery-label');
    if (lbl) lbl.innerHTML = `<span class="done">${passed}</span>/${total} cleared`
      + (sent ? ` · <span class="sent">${sent} sent to Claude</span>` : '');
  }

  // — auto: option-based (mcq / predict-output / fix-the-bug / spot-anti-pattern) —
  function renderOptions(ex, el) {
    const snip = ex.snippet ? `<div class="code-block"><div class="code-head"><span class="lang">${esc(ex.snippet.language || '')}</span></div><pre><code>${esc(ex.snippet.code)}</code></pre></div>` : '';
    const opts = (ex.options || []).map(o =>
      `<div class="opt" data-key="${esc(o.key)}"><span class="key">${esc(o.key).toUpperCase()}</span>`
      + `<div><div class="opt-text">${md(o.text)}</div><div class="opt-why">${md(o.why || '')}</div></div></div>`).join('');
    el.innerHTML = head(ex) + `<div class="ex-prompt">${md(ex.prompt)}</div>` + snip
      + `<div class="options">${opts}</div>`
      + `<div class="ex-actions"><button class="btn" data-act="check" disabled>Check</button></div>`
      + `<div class="ex-feedback" hidden></div>` + cite(ex);
    const optsEl = el.querySelector('.options');
    const btn = el.querySelector('[data-act="check"]');
    const fb = el.querySelector('.ex-feedback');
    let chosen = null;
    const prior = getState(ex.id);
    optsEl.querySelectorAll('.opt').forEach(o => o.addEventListener('click', () => {
      if (optsEl.classList.contains('answered')) return;
      optsEl.querySelectorAll('.opt').forEach(x => x.classList.remove('chosen'));
      o.classList.add('chosen'); chosen = o.dataset.key; btn.disabled = false;
    }));
    function reveal(correctKey, picked) {
      optsEl.classList.add('answered');
      optsEl.querySelectorAll('.opt').forEach(o => {
        if (o.dataset.key === correctKey) o.classList.add('correct');
        else if (o.dataset.key === picked) o.classList.add('incorrect');
      });
      const ok = picked === correctKey;
      fb.hidden = false;
      fb.className = 'ex-feedback ' + (ok ? 'ok' : 'crit');
      fb.innerHTML = `<span class="fb-lbl">${ok ? 'Correct' : 'Not quite'}</span>${md(ex.explanation || '')}`;
      btn.remove();
      const st = setState(ex.id, { status: ok ? 'passed' : 'failed', attempts: (prior ? prior.attempts : 0) + 1 });
      refreshBadge(el, ex);
    }
    btn.addEventListener('click', () => chosen && reveal(ex.answer, chosen));
  }

  // — auto: fill-in-the-blank ————————————————————————————————
  function renderFill(ex, el) {
    let i = 0;
    const promptHtml = md(ex.prompt).replace(/____+/g, () => {
      const b = (ex.blanks || [])[i++] || { id: 'b' + i };
      return `<input class="blank-input" data-blank="${esc(b.id)}" autocomplete="off">`;
    });
    el.innerHTML = head(ex) + `<div class="ex-prompt">${promptHtml}</div>`
      + `<div class="ex-actions"><button class="btn" data-act="check">Check</button></div>`
      + `<div class="ex-feedback" hidden></div>` + cite(ex);
    const fb = el.querySelector('.ex-feedback');
    el.querySelector('[data-act="check"]').addEventListener('click', () => {
      let allOk = true;
      el.querySelectorAll('.blank-input').forEach(inp => {
        const b = (ex.blanks || []).find(x => x.id === inp.dataset.blank) || {};
        const norm = (v) => String(v).trim().toLowerCase().replace(/\s+/g, '');
        const ok = (b.accepted || []).some(a => norm(a) === norm(inp.value));
        inp.classList.toggle('correct', ok); inp.classList.toggle('incorrect', !ok);
        if (!ok) allOk = false;
      });
      fb.hidden = false; fb.className = 'ex-feedback ' + (allOk ? 'ok' : 'crit');
      fb.innerHTML = `<span class="fb-lbl">${allOk ? 'Correct' : 'Not quite'}</span>${md(ex.explanation || '')}`;
      setState(ex.id, { status: allOk ? 'passed' : 'failed' }); refreshBadge(el, ex);
    });
  }

  // — auto: reorder-steps ————————————————————————————————————
  function renderReorder(ex, el) {
    let order = (ex.steps || []).map(s => s.id); // initial (as given — author should pre-shuffle, or we leave)
    function draw() {
      const rows = order.map((sid, idx) => {
        const s = ex.steps.find(x => x.id === sid);
        return `<div class="step-row" data-sid="${esc(sid)}"><div>${md(s.text)}</div>`
          + `<div class="moves"><button data-mv="up" ${idx === 0 ? 'disabled' : ''}>↑</button>`
          + `<button data-mv="down" ${idx === order.length - 1 ? 'disabled' : ''}>↓</button></div></div>`;
      }).join('');
      box.innerHTML = rows;
      box.querySelectorAll('.step-row').forEach(row => row.querySelectorAll('[data-mv]').forEach(b =>
        b.addEventListener('click', () => {
          const sid = row.dataset.sid, i = order.indexOf(sid);
          const j = b.dataset.mv === 'up' ? i - 1 : i + 1;
          if (j < 0 || j >= order.length) return;
          order.splice(i, 1); order.splice(j, 0, sid); draw();
        })));
    }
    el.innerHTML = head(ex) + `<div class="ex-prompt">${md(ex.prompt)}</div>`
      + `<div class="reorder"></div>`
      + `<div class="ex-actions"><button class="btn" data-act="check">Check order</button></div>`
      + `<div class="ex-feedback" hidden></div>` + cite(ex);
    const box = el.querySelector('.reorder');
    const fb = el.querySelector('.ex-feedback');
    draw();
    el.querySelector('[data-act="check"]').addEventListener('click', () => {
      const ok = JSON.stringify(order) === JSON.stringify(ex.correct_order || []);
      box.classList.add('answered');
      box.querySelectorAll('.step-row').forEach((row, idx) =>
        row.classList.add(order[idx] === (ex.correct_order || [])[idx] ? 'correct' : 'incorrect'));
      fb.hidden = false; fb.className = 'ex-feedback ' + (ok ? 'ok' : 'crit');
      fb.innerHTML = `<span class="fb-lbl">${ok ? 'Correct' : 'Not quite'}</span>${md(ex.explanation || '')}`;
      setState(ex.id, { status: ok ? 'passed' : 'failed' }); refreshBadge(el, ex);
    });
  }

  // — runnable lab (sandboxed iframe) ————————————————————————
  const RUNNER_SRCDOC = `<!doctype html><meta charset="utf-8"><script>
    let buf = [];
    function flushJoin(sep){ const s = buf.join(sep); buf = []; return s; }
    function runJS(code, harness, kind, expected){
      buf = []; const log = console.log;
      console.log = (...a)=>buf.push(a.map(x=>typeof x==='object'?JSON.stringify(x):String(x)).join(' '));
      try {
        (0,eval)(code + "\\n;\\n" + (harness||""));
        const out = buf.join("\\n"); console.log = log;
        if (kind === 'stdout') {
          const ok = out.trim() === String(expected||'').trim();
          return { ok, output: out, error: ok ? '' : 'stdout did not match expected' };
        }
        return { ok: true, output: out };
      } catch(err){ const out = buf.join("\\n"); console.log = log; return { ok:false, output: out, error: String(err && err.message || err) }; }
    }
    let pyodide = null;
    async function ensurePy(){
      if (pyodide) return pyodide;
      await new Promise((res,rej)=>{ const s=document.createElement('script'); s.src=${JSON.stringify(PYODIDE_CDN)}; s.onload=res; s.onerror=()=>rej(new Error('offline')); document.head.appendChild(s); });
      pyodide = await loadPyodide(); return pyodide;
    }
    async function runPy(code, harness, kind, expected){
      let py; try { py = await ensurePy(); } catch(e){ return { ok:false, offline:true, error:'Python runtime unavailable (offline)' }; }
      buf = []; py.setStdout({ batched: (s)=>buf.push(s) });
      try { await py.runPythonAsync(code + "\\n" + (harness||"")); const out = buf.join("");
        if (kind === 'stdout'){ const ok = out.trim() === String(expected||'').trim(); return { ok, output: out, error: ok?'':'stdout did not match expected' }; }
        return { ok:true, output: out };
      } catch(err){ return { ok:false, output: buf.join(""), error: String(err && err.message || err) }; }
    }
    addEventListener('message', async (e)=>{
      const m = e.data||{}; if (m.type!=='run') return;
      let r; try { r = m.runtime==='python' ? await runPy(m.code,m.harness,m.kind,m.expected) : runJS(m.code,m.harness,m.kind,m.expected); }
      catch(err){ r = { ok:false, error:String(err) }; }
      parent.postMessage(Object.assign({ type:'result', id:m.id }, r), '*');
    });
    parent.postMessage({ type:'ready' }, '*');
  <\/script>`;

  function runInSandbox(job) {
    return new Promise((resolve) => {
      const frame = document.createElement('iframe');
      frame.className = 'kg-lab-frame';
      frame.setAttribute('sandbox', 'allow-scripts');
      frame.srcdoc = RUNNER_SRCDOC;
      let done = false;
      const finish = (r) => { if (done) return; done = true; clearTimeout(timer); window.removeEventListener('message', onMsg); frame.remove(); resolve(r); };
      const onMsg = (e) => {
        if (e.source !== frame.contentWindow) return;
        const m = e.data || {};
        if (m.type === 'ready') frame.contentWindow.postMessage(Object.assign({ type: 'run' }, job), '*');
        else if (m.type === 'result') finish(m);
      };
      window.addEventListener('message', onMsg);
      const timer = setTimeout(() => finish({ ok: false, error: 'Timed out (possible infinite loop)' }), (job.timeout || 5000) + 1500);
      document.body.appendChild(frame);
    });
  }

  function renderLab(ex, el) {
    const rt = ex.runtime || 'js';
    el.innerHTML = head(ex) + `<div class="ex-prompt">${md(ex.prompt)}</div>`
      + `<div class="runner"><div class="runtime-tag">runtime · ${esc(rt)}</div>`
      + `<textarea class="runner-editor" spellcheck="false"></textarea>`
      + `<div class="ex-actions"><button class="btn" data-act="run">Run &amp; check</button>`
      + `<button class="btn ghost" data-act="solution">Reveal solution</button>`
      + `<button class="btn ghost" data-act="reset">Reset</button></div>`
      + `<div class="runner-out" hidden><div class="out-head">output</div><pre></pre></div>`
      + `<div class="runner-verdict" hidden></div></div>` + cite(ex);
    const ta = el.querySelector('.runner-editor'); ta.value = ex.starter_code || '';
    const outBox = el.querySelector('.runner-out'); const outPre = outBox.querySelector('pre');
    const verdict = el.querySelector('.runner-verdict');
    const runBtn = el.querySelector('[data-act="run"]');
    el.querySelector('[data-act="solution"]').addEventListener('click', () => { ta.value = ex.solution_code || ta.value; });
    el.querySelector('[data-act="reset"]').addEventListener('click', () => { ta.value = ex.starter_code || ''; outBox.hidden = true; verdict.hidden = true; });
    runBtn.addEventListener('click', async () => {
      runBtn.disabled = true; runBtn.textContent = (rt === 'python' ? 'Loading Python…' : 'Running…');
      const chk = ex.check || {};
      const r = await runInSandbox({ id: ex.id, runtime: rt, code: ta.value, harness: chk.harness || '', kind: chk.kind || 'assert', expected: chk.expected_stdout, timeout: chk.timeout_ms });
      runBtn.disabled = false; runBtn.textContent = 'Run & check';
      if (r.output != null && r.output !== '') { outBox.hidden = false; outPre.innerHTML = `<span class="o">${esc(r.output)}</span>`; }
      verdict.hidden = false;
      if (r.offline) {
        verdict.className = 'runner-verdict warn';
        verdict.innerHTML = `<span class="v-icon">⚠</span><span>Python needs a network connection (loads Pyodide once). You're offline — reveal the solution or run it locally, then use “Check with Claude”.</span>`;
        return;
      }
      if (r.ok) {
        verdict.className = 'runner-verdict pass';
        verdict.innerHTML = `<span class="v-icon">✓</span><span>Passed — the check is satisfied.</span>`;
        setState(ex.id, { status: 'passed' });
      } else {
        verdict.className = 'runner-verdict fail';
        verdict.innerHTML = `<span class="v-icon">✗</span><span>${esc(r.error || 'Check failed.')}</span>`;
        setState(ex.id, { status: 'failed' });
      }
      refreshBadge(el, ex);
    });
  }

  // — open task (check with Claude) ——————————————————————————
  function renderOpen(ex, el) {
    el.innerHTML = head(ex) + `<div class="ex-prompt">${md(ex.prompt)}</div>`
      + `<textarea class="attempt-box" placeholder="Write your answer here, then send it to Claude to be graded against the rubric…"></textarea>`
      + `<div class="ex-actions"><button class="btn" data-act="grade">Copy grading prompt for Claude</button></div>`
      + `<div class="ex-feedback note" hidden></div>` + cite(ex);
    const ta = el.querySelector('.attempt-box');
    const fb = el.querySelector('.ex-feedback');
    el.querySelector('[data-act="grade"]').addEventListener('click', async () => {
      const cmd = `/the-knowledge-guy check ${skillSlug} ${bookNumber} ${ex.id}\n--- my attempt ---\n` + (ta.value || '(no attempt written yet)');
      let copied = false;
      try { await navigator.clipboard.writeText(cmd); copied = true; } catch (e) {
        ta.value = cmd; ta.focus(); ta.select(); // fallback: select so the user can Cmd-C
      }
      setState(ex.id, { status: 'sent' });
      fb.hidden = false;
      fb.innerHTML = `<span class="fb-lbl">${copied ? 'Copied' : 'Select & copy'}</span>`
        + (copied ? 'Paste it into Claude Code to have your answer graded against the rubric.'
                  : 'The grading command is now in the box above — copy it and paste into Claude Code.');
      refreshBadge(el, ex);
    });
  }

  function refreshBadge(el, ex) {
    const h = el.querySelector('.ex-head'); if (!h) return;
    const fresh = document.createElement('div'); fresh.innerHTML = head(ex);
    h.replaceWith(fresh.firstChild);
  }

  // — dispatch ————————————————————————————————————————————————
  const RENDER = {
    mcq: renderOptions, 'predict-output': renderOptions, 'fix-the-bug': renderOptions,
    'spot-anti-pattern': renderOptions, 'fill-in-the-blank': renderFill,
    'reorder-steps': renderReorder, lab: renderLab,
    'design-task': renderOpen, explain: renderOpen, 'threat-model': renderOpen, 'repro-writeup': renderOpen,
  };
  exercises.forEach(ex => {
    const el = document.createElement('div');
    el.className = 'exercise'; el.id = 'ex-' + (ex.id || '');
    const fn = RENDER[ex.type] || (ex.family === 'open' ? renderOpen : ex.family === 'runnable' ? renderLab : renderOptions);
    try { fn(ex, el); }
    catch (e) { el.innerHTML = `<div class="ex-feedback crit"><span class="fb-lbl">Unsupported</span>Exercise <code>${esc(ex.id)}</code> (type <code>${esc(ex.type)}</code>) could not be rendered.</div>`; }
    mount.appendChild(el);
  });
  paintMastery();
})();
</script>

<!-- ════════════════════════════════════════════════════════════════════
     CONCEPT WIDGET ENGINE (added by the-knowledge-guy `course` mode)
     Hydrates a #kg-concept-widgets JSON island into interactive theory
     illustrations. No-ops on every page without the island. Theme-safe by
     construction: it ONLY swaps .plate/.illus classes — never a fill/stroke.
     State is ephemeral (exploration, not graded). Self-contained / file://.
     ════════════════════════════════════════════════════════════════════ -->
<script>
(() => {
  const island = document.getElementById('kg-concept-widgets');
  if (!island) return;
  const mounts = document.querySelectorAll('[data-widget-id]');
  if (!mounts.length) return;
  let specs;
  try { specs = JSON.parse(island.textContent); } catch (e) { return; }
  const byId = {};
  (Array.isArray(specs) ? specs : []).forEach(w => { if (w && w.id) byId[w.id] = w; });

  const NS = 'http://www.w3.org/2000/svg';
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const SEMANTIC = ['ok', 'warn', 'crit', 'ins'];
  const esc = (s) => String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');

  const NODE_CLASS = {
    plate: { normal: 'node-bg', accent: 'node-accent', muted: 'node-bg-2' },
    illus: { normal: 'il-node', accent: 'il-node-acc', muted: 'il-node',
             ok: 'il-node-ok', warn: 'il-node-warn', crit: 'il-node-crit', ins: 'il-node-ins' },
  };
  const NODE_VARIANTS = {
    plate: ['node-bg', 'node-bg-2', 'node-accent'],
    illus: ['il-node', 'il-node-acc', 'il-node-ok', 'il-node-warn', 'il-node-crit', 'il-node-ins'],
  };
  const EDGE_CLASS = { plate: { normal: 'edge', emph: 'edge-emph' }, illus: { normal: 'il-edge', emph: 'il-edge-emph' } };
  const EDGE_VARIANTS = { plate: ['edge', 'edge-emph'], illus: ['il-edge', 'il-edge-emph'] };

  const el = (tag, attrs) => { const e = document.createElementNS(NS, tag); for (const k in (attrs || {})) e.setAttribute(k, attrs[k]); return e; };
  const txt = (s) => document.createTextNode(s == null ? '' : String(s));

  function applyNodeClass(rect, surface, kind) {
    const cls = NODE_CLASS[surface][kind] || NODE_CLASS[surface].normal;
    rect.classList.remove.apply(rect.classList, NODE_VARIANTS[surface]);
    rect.classList.add(cls);
  }
  function applyEdgeClass(path, surface, state, markers) {
    const cls = EDGE_CLASS[surface][state] || EDGE_CLASS[surface].normal;
    path.classList.remove.apply(path.classList, EDGE_VARIANTS[surface]);
    path.classList.add(cls);
    path.setAttribute('marker-end', 'url(#' + (state === 'emph' ? markers.emph : markers.base) + ')');
  }

  function makeArrowDefs(svg, surface, idBase) {
    const defs = el('defs');
    const mk = (id, cls) => {
      const m = el('marker', { id: id, viewBox: '0 0 10 10', refX: '8', refY: '5', markerWidth: '7', markerHeight: '7', orient: 'auto-start-reverse' });
      m.appendChild(el('path', { d: 'M0,0 L10,5 L0,10 z', class: cls }));
      return m;
    };
    const base = idBase + '-arr', emph = idBase + '-arr-emph';
    defs.appendChild(mk(base, surface === 'plate' ? 'arrow' : 'il-arrow'));
    defs.appendChild(mk(emph, surface === 'plate' ? 'arrow-emph' : 'il-arrow-emph'));
    svg.appendChild(defs);
    return { base: base, emph: emph };
  }

  function makeNode(n, surface) {
    const w = n.w || 120, h = n.h || 52;
    const g = el('g', { transform: 'translate(' + n.x + ' ' + n.y + ')' });
    const rect = el('rect', { x: -w / 2, y: -h / 2, width: w, height: h, rx: 7 });
    applyNodeClass(rect, surface, n.kind || 'normal');
    g.appendChild(rect);
    if (n.label) { const t = el('text', { x: 0, y: n.sub ? -3 : 5, class: surface === 'plate' ? 'node-label' : 'il-label' }); t.appendChild(txt(n.label)); g.appendChild(t); }
    if (n.sub)   { const s = el('text', { x: 0, y: 15, class: surface === 'plate' ? 'node-sub' : 'il-sub' }); s.appendChild(txt(n.sub)); g.appendChild(s); }
    return { g: g, rect: rect, node: n };
  }

  function makeEdge(e, nodeMap, surface, markers) {
    const a = nodeMap[e.from].node, b = nodeMap[e.to].node;
    const aw = (a.w || 120) / 2, bw = (b.w || 120) / 2;
    const x1 = a.x + aw, y1 = a.y, x2 = b.x - bw, y2 = b.y, mx = (x1 + x2) / 2;
    const d = (y1 === y2) ? ('M ' + x1 + ' ' + y1 + ' L ' + x2 + ' ' + y2)
                          : ('M ' + x1 + ' ' + y1 + ' L ' + mx + ' ' + y1 + ' L ' + mx + ' ' + y2 + ' L ' + x2 + ' ' + y2);
    const path = el('path', { d: d, fill: 'none' });
    applyEdgeClass(path, surface, e.emph ? 'emph' : 'normal', markers);
    let label = null;
    if (e.label) {
      const lx = mx, ly = y1, tw = e.label.length * 6.3 + 12;
      const bg = el('rect', { class: surface === 'plate' ? 'edge-label-bg' : 'il-pill-bg', x: lx - tw / 2, y: ly - 9, width: tw, height: 16, rx: 3 });
      const t = el('text', { x: lx, y: ly + 3, class: surface === 'plate' ? 'edge-label' : 'il-pill-text' }); t.appendChild(txt(e.label));
      label = { bg: bg, t: t };
    }
    return { path: path, edge: e, label: label };
  }

  function buildChrome(w, mount) {
    mount.classList.add('widget');
    mount.setAttribute('role', 'group');
    mount.setAttribute('aria-label', w.title || 'concept widget');
    mount.textContent = '';
    const head = document.createElement('div'); head.className = 'widget-head';
    head.innerHTML = '<span class="widget-title">' + esc((w.title || '').toUpperCase()) + '</span><span class="widget-kind">' + esc(w.type) + '</span>';
    const stage = document.createElement('div'); stage.className = 'widget-stage';
    const cap = document.createElement('div'); cap.className = 'widget-caption'; cap.setAttribute('aria-live', 'polite'); cap.textContent = w.caption || '';
    const controls = document.createElement('div'); controls.className = 'widget-controls';
    mount.appendChild(head); mount.appendChild(stage); mount.appendChild(cap); mount.appendChild(controls);
    return { stage: stage, cap: cap, controls: controls };
  }

  function buildSvg(w, stage) {
    const svg = el('svg', { viewBox: '0 0 640 280', role: 'img', preserveAspectRatio: 'xMidYMid meet' });
    const title = el('title'); title.appendChild(txt(w.title || '')); svg.appendChild(title);
    const desc = el('desc'); desc.appendChild(txt(w.caption || w.title || '')); svg.appendChild(desc);
    if (w.surface === 'illus') { svg.setAttribute('class', 'illus'); stage.appendChild(svg); }
    else {
      const plate = document.createElement('div'); plate.className = 'plate';
      const body = document.createElement('div'); body.className = 'plate-body';
      body.appendChild(svg); plate.appendChild(body); stage.appendChild(plate);
    }
    return svg;
  }

  function drawGraph(svg, w) {
    const markers = makeArrowDefs(svg, w.surface, w.id);
    const nodeMap = {}; (w.nodes || []).forEach(n => { nodeMap[n.id] = makeNode(n, w.surface); });
    const edgeMap = {};
    (w.edges || []).forEach(e => {
      if (!nodeMap[e.from] || !nodeMap[e.to]) return;
      const em = makeEdge(e, nodeMap, w.surface, markers);
      edgeMap[e.id] = em;
      svg.appendChild(em.path);
      if (em.label) { svg.appendChild(em.label.bg); svg.appendChild(em.label.t); }
    });
    (w.nodes || []).forEach(n => svg.appendChild(nodeMap[n.id].g));
    return { nodeMap: nodeMap, edgeMap: edgeMap, markers: markers };
  }

  function btn(label, act) { const b = document.createElement('button'); b.className = 'btn ghost'; b.type = 'button'; b.dataset.act = act; b.textContent = label; return b; }

  // ---- flow / stepper ----
  function renderFlowLike(w, mount, withPlay) {
    const c = buildChrome(w, mount), svg = buildSvg(w, c.stage), g = drawGraph(svg, w);
    const steps = w.steps || []; let cur = 0; let playing = false;
    const prevB = btn('‹ Prev', 'prev'), stepL = document.createElement('span'); stepL.className = 'widget-step';
    const nextB = btn('Next ›', 'next');
    function applyStep(i) {
      const st = steps[i] || { active: [], activeEdges: [], caption: '' };
      const active = new Set(st.active || []), activeE = new Set(st.activeEdges || []);
      (w.nodes || []).forEach(n => {
        const nm = g.nodeMap[n.id]; if (!nm) return;
        const base = n.kind || 'normal', sem = SEMANTIC.indexOf(base) >= 0, on = active.has(n.id);
        applyNodeClass(nm.rect, w.surface, on ? (sem ? base : 'accent') : (sem ? 'normal' : base));
      });
      (w.edges || []).forEach(e => {
        const em = g.edgeMap[e.id]; if (!em) return;
        const on = activeE.has(e.id);
        applyEdgeClass(em.path, w.surface, on ? 'emph' : (e.emph ? 'emph' : 'normal'), g.markers);
        em.path.classList.toggle('kgw-playing', on && playing);
      });
      c.cap.textContent = st.caption || w.caption || '';
      stepL.textContent = (i + 1) + ' / ' + steps.length;
      prevB.disabled = i <= 0; nextB.disabled = i >= steps.length - 1;
    }
    prevB.addEventListener('click', () => { if (cur > 0) { cur--; applyStep(cur); } });
    nextB.addEventListener('click', () => { if (cur < steps.length - 1) { cur++; applyStep(cur); } });
    c.controls.appendChild(prevB); c.controls.appendChild(stepL); c.controls.appendChild(nextB);
    if (withPlay) {
      const playB = btn('▶ Play', 'play'); c.controls.appendChild(playB);
      playB.addEventListener('click', () => {
        if (reduce) { cur = steps.length - 1; applyStep(cur); return; }
        playing = true; playB.disabled = true; cur = 0; applyStep(0);
        const tick = () => { cur++; if (cur < steps.length) { applyStep(cur); setTimeout(tick, 1100); } else { playing = false; applyStep(cur = steps.length - 1); playB.disabled = false; } };
        setTimeout(tick, 1100);
      });
    }
    applyStep(0);
  }

  // ---- toggle-state ----
  function renderToggle(w, mount) {
    const c = buildChrome(w, mount), svg = buildSvg(w, c.stage), g = drawGraph(svg, w);
    const toggles = w.toggles || [], state = toggles.map(t => !!t.default);
    function apply() {
      (w.nodes || []).forEach(n => { const nm = g.nodeMap[n.id]; if (nm) applyNodeClass(nm.rect, w.surface, n.kind || 'normal'); });
      (w.edges || []).forEach(e => { const em = g.edgeMap[e.id]; if (em) applyEdgeClass(em.path, w.surface, e.emph ? 'emph' : 'normal', g.markers); });
      let cap = w.caption || '';
      toggles.forEach((t, i) => {
        const br = state[i] ? t.on : t.off; if (!br) return;
        const nc = br.nodeClass || {}; for (const id in nc) { const nm = g.nodeMap[id]; if (nm) applyNodeClass(nm.rect, w.surface, nc[id]); }
        const ec = br.edgeClass || {}; for (const id in ec) { const em = g.edgeMap[id]; if (em) applyEdgeClass(em.path, w.surface, ec[id], g.markers); }
        if (br.caption) cap = br.caption;
      });
      c.cap.textContent = cap;
    }
    toggles.forEach((t, i) => {
      const b = document.createElement('button'); b.className = 'btn ghost widget-toggle'; b.type = 'button';
      b.setAttribute('role', 'switch'); b.setAttribute('aria-checked', String(state[i])); b.textContent = t.label || ('Toggle ' + (i + 1));
      b.addEventListener('click', () => { state[i] = !state[i]; b.setAttribute('aria-checked', String(state[i])); apply(); });
      c.controls.appendChild(b);
    });
    apply();
  }

  // ---- slider ----
  function renderSlider(w, mount) {
    const c = buildChrome(w, mount), svg = buildSvg(w, c.stage), g = drawGraph(svg, w);
    const cfg = w.slider || {}, vis = w.visual || {};
    const capNode = (w.nodes || []).find(n => n.id === vis.capacityNode);
    const fillNm = g.nodeMap[vis.fillNode];
    if (fillNm) svg.appendChild(fillNm.g); // keep the fill on top of the capacity bar
    const min = +cfg.min || 0, max = (cfg.max != null ? +cfg.max : 100), thr = (cfg.threshold != null ? +cfg.threshold : max);
    const capW = (capNode && capNode.w) || 480, capLeft = (capNode ? capNode.x : 320) - capW / 2;
    const fillH = (fillNm && fillNm.node.h) || 40, fillY = (fillNm ? fillNm.node.y : 150) - fillH / 2;
    function apply(val) {
      const frac = Math.max(0, Math.min(1, (val - min) / ((max - min) || 1)));
      if (fillNm) {
        fillNm.g.setAttribute('transform', 'translate(0 0)');
        fillNm.rect.setAttribute('x', capLeft); fillNm.rect.setAttribute('y', fillY);
        fillNm.rect.setAttribute('width', Math.max(2, frac * capW)); fillNm.rect.setAttribute('height', fillH);
        applyNodeClass(fillNm.rect, 'illus', val >= thr ? 'crit' : 'normal');
      }
      readout.textContent = val + ' ' + (cfg.unit || '');
      c.cap.textContent = (val >= thr ? (w.atOrAbove && w.atOrAbove.caption) : (w.below && w.below.caption)) || w.caption || '';
    }
    const lab = document.createElement('span'); lab.className = 'widget-step'; lab.textContent = cfg.label || '';
    const range = document.createElement('input'); range.type = 'range';
    range.min = min; range.max = max; range.step = cfg.step || 1; range.value = (cfg.default != null ? cfg.default : min);
    range.setAttribute('aria-label', cfg.label || 'value');
    const readout = document.createElement('span'); readout.className = 'widget-readout';
    range.addEventListener('input', () => apply(+range.value));
    c.controls.appendChild(lab); c.controls.appendChild(range); c.controls.appendChild(readout);
    apply(+range.value);
  }

  // ---- compare ----
  function renderCompare(w, mount) {
    const c = buildChrome(w, mount), svg = buildSvg(w, c.stage);
    const panels = w.panels || [], groups = {};
    panels.forEach(p => {
      const pw = p.w || 260, ph = p.h || 120;
      const grp = el('g', { transform: 'translate(' + p.x + ' ' + p.y + ')', tabindex: '0', role: 'button', class: 'panel-btn' });
      grp.setAttribute('aria-label', (p.label || '') + ': ' + (p.detail || ''));
      const rect = el('rect', { x: -pw / 2, y: -ph / 2, width: pw, height: ph, rx: 8 });
      applyNodeClass(rect, w.surface, 'normal'); grp.appendChild(rect);
      const t = el('text', { x: 0, y: -4, class: w.surface === 'plate' ? 'node-label' : 'il-label' }); t.appendChild(txt(p.label)); grp.appendChild(t);
      if (p.sub) { const s = el('text', { x: 0, y: 15, class: w.surface === 'plate' ? 'node-sub' : 'il-sub' }); s.appendChild(txt(p.sub)); grp.appendChild(s); }
      svg.appendChild(grp); groups[p.id] = { g: grp, rect: rect };
      const select = () => { panels.forEach(q => applyNodeClass(groups[q.id].rect, w.surface, q.id === p.id ? 'accent' : 'normal')); c.cap.textContent = p.detail || w.caption || ''; };
      grp.addEventListener('click', select);
      grp.addEventListener('keydown', (ev) => { if (ev.key === 'Enter' || ev.key === ' ') { ev.preventDefault(); select(); } });
    });
    c.cap.textContent = w.caption || '';
  }

  function renderUnsupported(w, mount) {
    mount.classList.add('widget');
    mount.innerHTML = '<div class="ex-feedback crit" style="margin:0"><span class="fb-lbl">Widget</span>Unsupported type <code>' + esc(w.type) + '</code>.</div>';
  }

  const RENDER = {
    flow: (w, m) => renderFlowLike(w, m, true),
    stepper: (w, m) => renderFlowLike(w, m, false),
    'toggle-state': renderToggle,
    slider: renderSlider,
    compare: renderCompare,
  };

  mounts.forEach(m => {
    const w = byId[m.dataset.widgetId]; if (!w) return;
    try { (RENDER[w.type] || renderUnsupported)(w, m); }
    catch (e) { m.classList.add('widget'); m.innerHTML = '<div class="ex-feedback crit" style="margin:0"><span class="fb-lbl">Widget</span>could not render.</div>'; }
  });
})();
</script>

<!-- Standalone mastery meters (course index): paint any .mastery[data-total]
     from the shared progress store. A skill-level scope sums all its chapters. -->
<script>
(() => {
  const meters = document.querySelectorAll('.mastery[data-total]');
  if (!meters.length) return;
  let all = {}; try { all = JSON.parse(localStorage.getItem('kg-lab-progress-v1')) || {}; } catch (e) {}
  const passedIn = (s) => Object.values(s || {}).filter(x => x && x.status === 'passed').length;
  meters.forEach(m => {
    const scope = m.dataset.scope, total = +m.dataset.total || 0;
    let passed = 0;
    if (all[scope]) passed = passedIn(all[scope]);
    else Object.keys(all).filter(k => k === scope || k.startsWith(scope + '/')).forEach(k => passed += passedIn(all[k]));
    const pct = total ? Math.round(passed / total * 100) : 0;
    const f = m.querySelector('.mastery-fill'); if (f) f.style.width = pct + '%';
    m.classList.toggle('complete', total > 0 && passed === total);
    const l = m.querySelector('.mastery-label'); if (l) l.innerHTML = `<span class="done">${passed}</span>/${total} cleared`;
  });
})();
</script>
